# TensorRT model catalog.
#
# Format:
# name|task|engine|input_kind|shape|type|scale|layout
#
# `engine` is relative to the repository root (or to this file when the
# repository root is not the current directory). The catalog describes the
# expected input contract; it does not fabricate an engine. Generate or copy
# each plan with a TensorRT version and GPU architecture compatible with the
# runtime container before running it.
#
# input_kind=image uses an image path and performs resize, RGB conversion and
# NCHW/NHWC packing. input_kind=tensor reads a raw binary tensor with exactly
# the declared shape and type. The defaults below are common export profiles;
# change them when an engine uses a different profile.

# Detection engines already shipped with this repository.
yolov5s_fp32|detection|weights/yolov5-6.0/yolov5s-kFLOAT-batch1.engine|image|1,3,640,640|float32|0.003921568627|nchw
yolov5s_fp16|detection|weights/yolov5-6.0/yolov5s-kHALF-batch1.engine|image|1,3,640,640|float32|0.003921568627|nchw
yolov5s_int8|detection|weights/yolov5-6.0/yolov5s-kINT8-batch1.engine|image|1,3,640,640|float32|0.003921568627|nchw

# Feature extraction and matching. SIFT/HOG/SGM/ADCensus themselves remain
# OpenCV/CUDA algorithms; SuperPoint/SuperGlue can be exported as TRT plans.
